name: Deploy Mai Edo South

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            cd /var/www/mai-edo-south
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building app..."
            npm run build

            echo "Restarting app..."
            if pm2 describe mai-edo-south > /dev/null 2>&1; then
              PORT=3006 pm2 restart mai-edo-south --update-env
            else
              PORT=3006 pm2 start npm --name mai-edo-south -- start
            fi
            pm2 save

            echo "Checking app status..."
            pm2 status mai-edo-south
            echo "✅ Deploy complete!"
